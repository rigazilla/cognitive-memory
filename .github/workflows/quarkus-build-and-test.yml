name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus

      - name: Run tests
        run: ./mvnw -B test
        working-directory: cognition-processor-quarkus

      - name: Run static analysis (Checkstyle + SpotBugs)
        if: matrix.os == 'ubuntu-latest'
        run: ./mvnw -B verify -DskipTests
        working-directory: cognition-processor-quarkus

      - name: Annotate Checkstyle violations
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        uses: jwgmeligmeyling/checkstyle-github-action@50292990e18466f2c5d95d04ff5fab931254fa5f # v1.2
        with:
          path: cognition-processor-quarkus/target/checkstyle-result.xml

      - name: Annotate SpotBugs findings
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        uses: jwgmeligmeyling/spotbugs-github-action@b8e2c3523acb34c87f14e18cbcd2d87db8c8584e # v1.2
        with:
          path: cognition-processor-quarkus/target/spotbugsXml.xml

      - name: Upload static analysis reports
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis-reports
          path: |
            cognition-processor-quarkus/target/checkstyle-result.xml
            cognition-processor-quarkus/target/spotbugsXml.xml
          if-no-files-found: ignore
